services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.1
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_LOG_LEVEL: "warn"
    ports:
      - "127.0.0.1:${KC_PORT:-18080}:8080"
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
