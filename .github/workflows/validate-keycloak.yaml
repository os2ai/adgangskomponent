name: Validate realm config

on:
  pull_request:

jobs:
  validate:
    name: Validate realm config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 #v3
      - name: Install helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 #v3
        with:
          version: 4.2.0
      # The script parses the rendered manifests with PyYAML. Installed via apt (the runner's
      # system python is externally managed and refuses plain pip installs), but only when the
      # python3 actually on PATH lacks it, so the common case skips the apt run entirely.
      - name: Ensure PyYAML
        run: |
          python3 -c 'import yaml' 2>/dev/null && exit 0
          sudo apt-get update && sudo apt-get install -y python3-yaml
          python3 -c 'import yaml'
      # Renders the chart (building the provider jar itself, which is gitignored) and imports the
      # realm into a throwaway Keycloak via docker compose, asserting the cluster-access setup.
      - name: Validate realm config
        run: bash scripts/validate-keycloak.sh
