ingress:
  #annotations:ingressClassName: {{ .Values.ingressClassName }}
  #  cert-manager.io/cluster-issuer: letsencrypt
  #tlsSecret: keycloak-tls-secret
  #className:
db:
  #vendor: postgres
  #host: cloudnative-pg-cluster-rw
  #database: os2adgang
  #usernameSecret:
  #  name: cloudnative-pg-cluster-admin
  #  key: username
  #passwordSecret:
  #  name: cloudnative-pg-cluster-admin
  #  key: password

admin:
  ui:
    #domain:
    image:
      repository: ghcr.io/os2ai/adgangskomponent/admin-ui
    # Small static asset server, so the defaults are deliberately tiny.
    # Served assets are CPU idle and the container peaks at around 5MB, so
    # these are unlikely to ever need changing.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  api:
    #domain:
    image:
      repository: ghcr.io/os2ai/adgangskomponent/admin-api
    # Small API, so the defaults are deliberately tiny. Note it shells
    # out to openssl for certificate conversion. A single 8192 bit certificate
    # upload peaks at around 25MB and 0.05 CPU seconds, and ten concurrent
    # uploads at around 32MB, so the defaults leave ample memory headroom.
    # The cpu limit is the only value likely to need raising: concurrent
    # uploads are CPU bound in openssl and get throttled at 500m.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
