{{- /*
The Keycloak ingress in bundled mode. In operator mode the operator creates the ingress itself
from the Keycloak CR's `spec.ingress`, fed by the same `ingress` values.
*/}}
{{- if eq (include "adgangskomponent.keycloakMode" .) "bundled" }}
{{- $name := "keycloak" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  {{- with (.Values.ingress).annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  {{- with (.Values.ingress).className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "domain is required" .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: 8080
  tls:
    - hosts:
        - {{ .Values.domain }}
      secretName: {{ (.Values.ingress).tlsSecret | default "keycloak-tls-secret" }}
{{- end }}
