apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-admin-api
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-admin-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-admin-api
    spec:
      containers:
      - name: admin-api
        image: {{ .Values.admin.api.image.repository }}:{{ .Values.admin.api.image.tag | default .Chart.Version }}
        resources:
          {{- toYaml .Values.admin.api.resources | nindent 10 }}
        ports:
        - name: http
          containerPort: 5701
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        env:
        {{- $origins := printf "https://%s" (.Values.admin.ui.domain | default (print "admin." .Values.domain)) }}
        {{- if hasKey .Values.admin.api "corsAllowedOrigins" }}
        {{- $origins = .Values.admin.api.corsAllowedOrigins }}
        {{- end }}
        - name: CORS_ALLOWED_ORIGINS
          value: {{ $origins | quote }}
