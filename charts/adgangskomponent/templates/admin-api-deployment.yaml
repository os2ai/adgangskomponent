apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-admin-api
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-admin-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-admin-api
    spec:
      containers:
      - name: admin-api
        image: {{ .Values.admin.api.image.repository }}:{{ .Values.admin.api.image.tag | default .Chart.Version }}
        resources:
          {{- with .Values.admin.api.resources }}
          {{- toYaml . | nindent 10 }}
          {{- else }}
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
          {{- end }}
