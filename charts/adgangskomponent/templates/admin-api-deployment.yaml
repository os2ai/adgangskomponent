apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-admin-api
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-admin-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-admin-api
    spec:
      containers:
      - name: admin-api
        image: {{ .Values.admin.api.image.repository }}:{{ .Values.admin.api.image.tag | default .Chart.Version }}
        env:
        - name: CORS_ALLOWED_ORIGINS
          value: {{ .Values.admin.api.corsAllowedOrigins | default (printf "https://%s" (.Values.admin.ui.domain | default (print "admin." .Values.domain))) | quote }}
