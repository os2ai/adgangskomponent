{{- $admin := .Values.admin | default dict }}
{{- $api := get $admin "api" | default dict }}
{{- $apiIngress := get $api "ingress" | default dict }}
{{- $globalIngress := .Values.ingress | default dict }}
{{- $className := get $apiIngress "className" | default (get $globalIngress "className") }}
{{- $annotations := dict }}
{{- $_ := merge $annotations (get $apiIngress "annotations" | default dict) (get $globalIngress "annotations" | default dict) }}
{{- /* Body-size limit follows the ingress class: nginx needs proxy-body-size, traefik uses the buffering middleware CRD instead. */}}
{{- if or (not $className) (eq $className "nginx") }}
{{- $_ := set $annotations "nginx.ingress.kubernetes.io/proxy-body-size" (get $api "maxBodySize" | default "50m") }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ get $api "domain" | default (print "api.admin." .Values.domain) }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ get $api "domain" | default (print "api.admin." .Values.domain) }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-admin-api
                port:
                  number: 80
  tls:
    - hosts:
        - {{ get $api "domain" | default (print "api.admin." .Values.domain) }}
      secretName: {{ get $api "domain" | default (print "api.admin." .Values.domain) }}-tls
