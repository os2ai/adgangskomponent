{{- $admin := .Values.admin | default dict }}
{{- $ui := get $admin "ui" | default dict }}
{{- $uiIngress := get $ui "ingress" | default dict }}
{{- $globalIngress := .Values.ingress | default dict }}
{{- $className := get $uiIngress "className" | default (get $globalIngress "className") }}
{{- $annotations := dict }}
{{- $_ := merge $annotations (get $uiIngress "annotations" | default dict) (get $globalIngress "annotations" | default dict) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ get $ui "domain" | default (print "admin." .Values.domain) }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ get $ui "domain" | default (print "admin." .Values.domain) }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-admin-ui
                port:
                  number: 80
  tls:
    - hosts:
        - {{ get $ui "domain" | default (print "admin." .Values.domain) }}
      secretName: {{ get $ui "domain" | default (print "admin." .Values.domain) }}-tls
